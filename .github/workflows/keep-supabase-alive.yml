name: Keep Supabase Alive

# Version debug : on rend curl bavard pour voir l'erreur exacte.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -x
          echo "Longueur URL : ${#SUPABASE_URL} caracteres"
          echo "Longueur cle : ${#SUPABASE_ANON_KEY} caracteres"
          # -sS = silencieux mais affiche les erreurs. -v = verbose.
          # Pas de -f car 401 est une reponse valide (= base reveillee).
          curl -sSv \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -o /dev/null
          echo "Curl a fini sans erreur. Base reveillee."

      - name: Update heartbeat file
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > last_ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_ping.txt
          if git diff --staged --quiet; then
            echo "Aucun changement, rien a commiter."
          else
            git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)"
            git push
          fi
