# render.yaml — Configuration de déploiement pour Render.com
#
# Ce fichier est lu automatiquement par Render lors de la création du service.
# Documentation : https://render.com/docs/yaml-spec

services:
  - type: web
    name: troupeau-api
    runtime: python
    # Render exécutera les commandes depuis ce sous-dossier
    rootDir: backend

    # Commande exécutée une seule fois à chaque déploiement :
    # installe les dépendances Python listées dans requirements.txt
    buildCommand: pip install -r requirements.txt

    # Commande de démarrage du serveur en production :
    #   --host 0.0.0.0  → accessible depuis l'extérieur (obligatoire sur Render)
    #   --port $PORT    → Render attribue le port via cette variable d'environnement
    #   sans --reload   → le rechargement automatique n'est utile qu'en développement
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    plan: free

    envVars:
      # Version Python cible sur Render.
      # Python 3.14 (utilisé en local) n'est pas encore disponible sur Render ;
      # 3.13 est la version la plus récente supportée.
      # Les packages sont compatibles avec 3.13.
      - key: PYTHON_VERSION
        value: "3.13.0"

# ⚠️  Limite du tier gratuit — base de données SQLite éphémère :
#
# Le filesystem de Render (tier gratuit) est réinitialisé à chaque redémarrage
# ou redéploiement. Le fichier troupeau.db sera donc perdu.
#
# Solutions possibles quand le projet sera plus avancé :
#   - Render Persistent Disk (payant, ~1 $/mois pour 1 Go)
#   - Migrer vers une base PostgreSQL (Render propose un tier gratuit limité)
#   - Sauvegarder/restaurer la base manuellement via un script
